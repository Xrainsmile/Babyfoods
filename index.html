<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7F2">
  <meta name="description" content="给宝妈宝爸、爷爷奶奶的宝宝辅食工具：按阶段菜谱、每周菜单、食材红黑榜、饮食安全原则。覆盖 6 个月到 3 岁。">
  <title>Babyfoods · 宝宝辅食指南（6个月-3岁）</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <!-- 顶部壳层：App Header + 两层导航（sticky，滚动后 glass） -->
  <header class="top-shell" id="topShell">
    <div class="app-header">
      <div class="brand"><span class="brand-dot" aria-hidden="true"></span>Babyfoods</div>
      <div class="header-context" id="headerContext"></div>
    </div>

    <!-- 第一层：月龄 + 搜索 -->
    <div class="nav-primary">
      <div class="stage-picker" id="stagePicker">
        <button class="stage-btn" id="stageBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="选择宝宝月龄">
          <span id="stageBtnLabel">6-8月龄</span>
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></span>
        </button>
        <div class="stage-popover" id="stagePopover" role="listbox" aria-label="月龄选项"></div>
      </div>

      <div class="search-box" id="searchBox">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input type="search" id="searchInput" placeholder="搜菜谱、食材、宝宝问题" aria-label="搜索菜谱、食材" />
        <button class="search-clear" id="searchClear" aria-label="清除搜索">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
        </button>
      </div>
    </div>

    <!-- 第二层：功能 Tab -->
    <nav class="section-tabs" id="sectionTabs" role="tablist" aria-label="功能板块"></nav>
  </header>

  <!-- 主内容 -->
  <main class="page" id="main"></main>

  <!-- 底部导航 -->
  <nav class="bottom-nav" id="bottomNav" aria-label="主导航">
    <button data-nav="home" class="active">
      <span class="bn-icon"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span></span>
      首页
    </button>
    <button data-nav="principles">
      <span class="bn-icon"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M10 3v4a2 2 0 0 0 1 1.73V21a1 1 0 0 0 2 0V8.73A2 2 0 0 0 14 7V3"/><line x1="9" y1="13" x2="15" y2="13"/></svg></span></span>
      宝宝食物原则
    </button>
  </nav>

  <!-- 数据 -->
  <script src="data/sources.js"></script>
  <script src="data/principles.js"></script>
  <script src="data/ingredients.js"></script>
  <script src="data/meal-plans.js"></script>
  <script src="data/recipes.js"></script>
  <!-- 逻辑 -->
  <script src="js/app.js"></script>
</body>
</html>
